<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img"
     aria-label="Journal des rencontres et des médias">
  <!-- Un carnet : le « journal » du titre, dans l'orange de l'application
       (la variable CSS brand). Dessiné plutôt que repris de l'emoji de
       l'en-tête, qui
       serait illisible à 16 px et dépendrait de la police du système. -->
  <rect width="64" height="64" rx="14" fill="#ff971b"/>
  <rect x="17" y="12" width="30" height="40" rx="4" fill="#fff"/>
  <!-- La pince du porte-bloc. -->
  <rect x="26" y="8" width="12" height="8" rx="3" fill="#b45309"/>
  <!-- Trois lignes d'écriture, la dernière plus courte. -->
  <rect x="23" y="26" width="18" height="3.5" rx="1.75" fill="#ff971b"/>
  <rect x="23" y="34" width="18" height="3.5" rx="1.75" fill="#ff971b"/>
  <rect x="23" y="42" width="11" height="3.5" rx="1.75" fill="#ff971b"/>
</svg>
